name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Build runs unprivileged. Only the deploy job receives the Cloudflare token.
permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Wrangler
        # Pinned explicitly: the wrangler-action falls back to v3, which
        # cannot resolve the entry point produced by the current Nitro layout.
        run: npm install --global wrangler@4

      - name: Register workers.dev subdomain
        # One-time per-account setup. Wrangler cannot do this itself and fails
        # with "or register a workers.dev subdomain here" until it exists.
        # A conflict here just means the subdomain is already taken; the name
        # only has to be unique, and the deploy prints the resulting URL.
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"fikrado"}' || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          {
            echo "### Deployed to Cloudflare Workers"
            echo ""
            echo "Set the admin password with:"
            echo '```sh'
            echo "npx wrangler secret put ADMIN_USERNAME   # fikrado"
            echo "npx wrangler secret put ADMIN_PASSWORD"
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"