name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Build runs unprivileged. Only the deploy job receives the Cloudflare token.
permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Wrangler
        # Pinned explicitly: the wrangler-action falls back to v3, which
        # cannot resolve the entry point produced by the current Nitro layout.
        run: npm install --global wrangler@4

      - name: Ensure News KV namespace
        # News posts and likes live in KV. Create the namespace on first run and
        # write the real id back into wrangler.json so later builds reuse it.
        run: |
          if grep -q "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" wrangler.json; then
            echo "::notice::Creating the NEWS KV namespace (first run)"
            npx wrangler kv namespace create NEWS || true
            ID=$(npx wrangler kv namespace list --json 2>/dev/null | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c)).on("end", () => {
                try {
                  const ns = JSON.parse(d);
                  const hit = ns.find((x) => x.title === "NEWS") || ns[0];
                  console.log(hit ? hit.id : "");
                } catch {
                  console.log("");
                }
              });
            ')
            if [ -n "$ID" ]; then
              node -e '
                const fs = require("fs");
                const c = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
                c.kv_namespaces[0].id = process.env.KV_ID;
                fs.writeFileSync("wrangler.json", JSON.stringify(c, null, 2) + "\n");
              ' KV_ID="$ID" 2>/dev/null || KV_ID="$ID" node -e '
                const fs = require("fs");
                const c = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
                c.kv_namespaces[0].id = process.env.KV_ID;
                fs.writeFileSync("wrangler.json", JSON.stringify(c, null, 2) + "\n");
              '
              echo "::notice::KV namespace id set"
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Register workers.dev subdomain
        # One-time per-account setup. Wrangler cannot do this itself and fails
        # with "or register a workers.dev subdomain here" until it exists.
        # A conflict here just means the subdomain is already taken; the name
        # only has to be unique, and the deploy prints the resulting URL.
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"fikrado"}' || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Diagnose subdomain registration
        if: always()
        run: |
          echo "--- token verify ---"
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 300
          echo; echo "--- account id we hold ---"
          echo "${CLOUDFLARE_ACCOUNT_ID:0:6}...(len=${#CLOUDFLARE_ACCOUNT_ID})"
          echo "--- accounts visible to this token ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 600
          echo; echo "--- existing workers.dev subdomain (GET) ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 400
          echo; echo "--- attempt create ---"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"fikrado"}' | head -c 400
          echo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        # Wrangler offers to register the workers.dev subdomain on first deploy
        # but CI has no TTY, so it fails. Answer the prompt automatically.
        run: yes | wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          {
            echo "### Deployed to Cloudflare Workers"
            echo ""
            echo "Set the admin password with:"
            echo '```sh'
            echo "npx wrangler secret put ADMIN_USERNAME   # fikrado"
            echo "npx wrangler secret put ADMIN_PASSWORD"
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"